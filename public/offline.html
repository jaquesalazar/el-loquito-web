
<!DOCTYPE html>
<!-- Página de respaldo de CatTube cuando no hay conexión a internet. -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3F9A1E">
  <title>Sin conexión | CatTube</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: #F8F7F2;
      color: #35452A;
      font-family: Arial, sans-serif;
    }

    .offline-container {
      width: 100%;
      max-width: 440px;
      padding: 40px 28px;
      background-color: #FFFFFF;
      border: 1px solid #E5E7DF;
      border-radius: 16px;
      text-align: center;
    }

    .offline-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background-color: #E3DCC2;
      color: #44581F;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    p {
      margin: 0 0 26px;
      color: #697366;
      font-size: 15px;
      line-height: 1.6;
    }

    button {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      background-color: #3F9A1E;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background-color: #327C17;
    }

    button:focus-visible {
      outline: 3px solid #327C17;
      outline-offset: 3px;
    }

    .brand {
      margin-top: 26px;
      color: #3F9A1E;
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="offline-container">
    <div class="offline-icon" aria-hidden="true">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
        <path d="M10.66 5.05A15 15 0 0 1 22 8.82"></path>
        <path d="M2 2l20 20"></path>
        <path d="M8.53 12.11a6 6 0 0 1 6.95.37"></path>
        <path d="M12 20h.01"></path>
      </svg>
    </div>

    <h1>Sin conexión</h1>

    <p>
      No pudimos cargar CatTube porque no tienes conexión a internet.
      Comprueba tu conexión e inténtalo nuevamente.
    </p>

    <button type="button" onclick="window.location.reload()">
      Reintentar
    </button>

    <div class="brand">CatTube </div>
  </main>
</body>
</html>
